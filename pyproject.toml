[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracelock"
version = "0.1.0"
description = "Runtime data-flow authorization contracts and gateway foundation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "TraceLock contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "PyJWT>=2.8,<3",
]

[project.scripts]
tracelock = "tracelock_services.app:run"

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "httpx>=0.27,<1",
  "types-PyJWT>=1.7,<2",
]

[tool.setuptools.packages.find]
include = ["tracelock_core*", "tracelock_services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["tracelock_core"]
